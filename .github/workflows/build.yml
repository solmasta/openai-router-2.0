cd ~/openai-router-2.0
mkdir -p .github/workflows
cat > .github/workflows/build.yml <<'EOF'
name: OpenAI Router Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install

      - name: Build Dashboard
        run: pnpm build:web
