services:
  - type: web
    name: openai-router-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m agents.api.main
    envVars:
      - key: PORT
        value: 8000

  - type: web
    name: openai-router-dashboard
    runtime: node
    buildCommand: pnpm install && pnpm build:web
    startCommand: pnpm --filter web dev --host 0.0.0.0
    envVars:
      - key: VITE_ROUTER_API_URL
        value: https://openai-router-agent.example.com
